<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="CHANEZ STORE — Tienda online de ropa urbana. Demo e-commerce Sala Cero." />
  <meta name="robots" content="noindex" />
  <title>CHANEZ STORE — Tienda online</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />
  <link rel="stylesheet" href="./css/vendor.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/chanez-theme.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300..800;1,300..800&family=Outfit:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
</head>

<body data-page="shop">
  <div id="chanez-chrome"></div>

  <div class="breadcrumb-bar">
    <nav class="breadcrumb-bar-inner" aria-label="Ruta de navegación">
      <a href="./index.html">Inicio</a>
      <span aria-hidden="true">›</span>
      <span>Tienda</span>
    </nav>
  </div>

  <section class="cat-banner">
    <img src="./assets/hero-chanez.webp" alt="Colección urbana CHANEZ STORE" loading="eager">
    <span class="cat-banner-label">Tienda</span>
  </section>

  <section id="tienda" class="shop-catalog">
    <div class="shop-filter-bar" role="navigation" aria-label="Filtros de productos">
      <div class="shop-filter-inner">
        <div class="shop-filter-item">
          <button type="button" class="shop-filter-toggle">Categoría <span aria-hidden="true">▾</span></button>
          <div class="shop-filter-menu" data-filter-menu="category"></div>
        </div>
        <div class="shop-filter-item">
          <button type="button" class="shop-filter-toggle">Color <span aria-hidden="true">▾</span></button>
          <div class="shop-filter-menu" data-filter-menu="color"></div>
        </div>
        <div class="shop-filter-item">
          <button type="button" class="shop-filter-toggle">Talla <span aria-hidden="true">▾</span></button>
          <div class="shop-filter-menu" data-filter-menu="size"></div>
        </div>
        <div class="shop-filter-item">
          <button type="button" class="shop-filter-toggle">Género <span aria-hidden="true">▾</span></button>
          <div class="shop-filter-menu" data-filter-menu="gender"></div>
        </div>
        <div class="shop-filter-item">
          <button type="button" class="shop-filter-toggle">Marca <span aria-hidden="true">▾</span></button>
          <div class="shop-filter-menu" data-filter-menu="brand"></div>
        </div>
        <div class="shop-filter-item">
          <button type="button" class="shop-filter-toggle">Ropa <span aria-hidden="true">▾</span></button>
          <div class="shop-filter-menu" data-filter-menu="ropa"></div>
        </div>
        <div class="shop-filter-item">
          <button type="button" class="shop-filter-toggle">Accesorios <span aria-hidden="true">▾</span></button>
          <div class="shop-filter-menu" data-filter-menu="accesorios"></div>
        </div>
        <div class="shop-filter-item">
          <button type="button" class="shop-filter-toggle">Precio <span aria-hidden="true">▾</span></button>
          <div class="shop-filter-menu" data-filter-menu="price"></div>
        </div>
      </div>
    </div>

    <div class="container-xl shop-grid-wrap">
      <p class="visually-hidden"><span id="shop-count">72 productos</span></p>
      <div class="row g-4 g-lg-5" id="shop-grid"></div>
      <div class="shop-bottom-bar">
        <nav id="shop-pagination" class="shop-pagination" aria-label="Paginación"></nav>
        <label class="shop-page-size">Mostrar
          <select id="shop-page-size" aria-label="Productos por página">
            <option value="12" selected>12</option>
            <option value="24">24</option>
            <option value="36">36</option>
          </select>
          por página
        </label>
      </div>
    </div>
  </section>

  <div id="chanez-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
  <script src="./js/layout.js"></script>
  <script src="./js/store.js"></script>
</body>

</html>
