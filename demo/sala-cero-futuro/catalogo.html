<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/demo/sala-cero-futuro/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Catálogo completo — Sala Cero Futuro</title>
  <link rel="icon" href="./assets/logo-sala-cero.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="catalogo.css">
  <style>
    .catalog-page { padding: clamp(6rem, 12vh, 8rem) var(--pad) 4rem; max-width: calc(var(--max) + var(--pad) * 2); margin: 0 auto; }
    .catalog-page { --light-gray: var(--muted); --accent-rose-light: var(--pink); --font-mono: "JetBrains Mono", monospace; }
    .catalog-page .section-head h1 { font-family: var(--font-display); font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 800; margin: 0; line-height: 1.05; }
    .catalog-page-nav { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1.5rem 0 2.5rem; }
  </style>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="scroll-progress" aria-hidden="true"><span></span></div>
  <p class="demo-badge">Catálogo · 24 productos</p>

  <header class="nav is-scrolled" data-nav>
    <a class="nav-logo" href="./index.html"><img src="./assets/logo-sala-cero.svg" alt="Sala Cero" width="100" height="52"></a>
    <nav class="nav-links">
      <a href="./index.html">Inicio</a>
      <a href="./catalogo.html">Catálogo</a>
      <a href="./catalogo-sala-cero.pdf" target="_blank" rel="noopener">PDF</a>
    </nav>
    <a class="nav-cta" href="./index.html#contacto">Contacto</a>
  </header>

  <main class="catalog-page">
    <div class="section-head reveal is-visible">
      <span class="tag">Precios / catálogo completo</span>
      <h1>Todo lo que <span class="gradient-text">hacemos</span></h1>
      <p style="color: var(--muted); max-width: 640px; margin-top: 1rem;">24 productos con precio, plazo, mantenimiento y qué incluye. Referencia en bolivianos — Santa Cruz, Bolivia.</p>
      <div class="catalog-page-nav">
        <a href="./catalogo-sala-cero.pdf" class="btn btn-primary" target="_blank" rel="noopener">Descargar PDF</a>
        <a href="./index.html#contacto" class="btn btn-ghost">Cotizar</a>
      </div>
    </div>
    <div id="catalog-full"></div>
  </main>

  <footer class="footer">
    <p>&copy; <span data-year></span> Sala Cero · Demo futurista</p>
  </footer>

  <script src="script.js"></script>
  <script src="./catalogo-sala-cero.js"></script>
  <script src="./js/productos-data.js"></script>
  <script src="./js/catalogo.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.SALA_CERO_CATALOGO && window.SalaCeroCatalogo) {
        SalaCeroCatalogo.render(document.getElementById("catalog-full"), window.SALA_CERO_CATALOGO);
      }
    });
  </script>
</body>
</html>
