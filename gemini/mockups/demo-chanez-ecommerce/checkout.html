<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Checkout — CHANEZ STORE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="./css/vendor.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/chanez-theme.css" />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body data-page="cart">
  <p class="demo-badge">Demo · E-commerce</p>
  <div id="chanez-chrome"></div>
  <main class="py-5">
    <div class="container">
      <h1 class="h3 text-uppercase mb-4">Finalizar compra</h1>
      <div class="row g-4">
        <div class="col-lg-7">
          <form id="checkout-form" class="bg-white border p-4">
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label" for="nombre">Nombre completo</label><input class="form-control" id="nombre" name="nombre" required /></div>
              <div class="col-md-6"><label class="form-label" for="telefono">WhatsApp / teléfono</label><input class="form-control" id="telefono" name="telefono" required /></div>
              <div class="col-md-6"><label class="form-label" for="ciudad">Ciudad</label><input class="form-control" id="ciudad" name="ciudad" required /></div>
              <div class="col-md-6"><label class="form-label" for="direccion">Dirección / referencia</label><input class="form-control" id="direccion" name="direccion" required /></div>
            </div>
            <h2 class="h6 text-uppercase mt-4 mb-3">Método de pago</h2>
            <div class="vstack gap-2">
              <label class="payment-pill active"><input type="radio" name="pago" value="QR Simple" checked hidden> QR Simple</label>
              <label class="payment-pill"><input type="radio" name="pago" value="Transferencia bancaria" hidden> Transferencia bancaria</label>
              <label class="payment-pill"><input type="radio" name="pago" value="Efectivo contra entrega" hidden> Efectivo contra entrega</label>
            </div>
            <button type="submit" class="btn btn-dark btn-lg w-100 mt-4 text-uppercase">Confirmar pedido por WhatsApp</button>
          </form>
        </div>
        <div class="col-lg-5"><div id="checkout-summary"></div></div>
      </div>
    </div>
  </main>
  <footer class="site-footer-chanez py-4"><div class="container d-flex flex-wrap justify-content-between align-items-center gap-3"><a class="footer-logo brand-lockup d-flex align-items-center gap-2" href="./index.html"><span class="brand-mark"><span class="brand-mark-top">CHANEZ</span><span class="brand-mark-bottom">STORE</span></span><span class="small">Demo checkout · En producción se integran pagos reales</span></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="./js/layout.js"></script>
  <script src="./js/store.js"></script>
</body>
</html>
